# Anonim analitik toplama + Caddy (otomatik TLS). Kurulum: ./install.sh  ·  Ayrıntı: README.md
# Anonimlik ayarları: Caddy erişim günlüğü KAPALI (Caddyfile), uygulama kayıt tutmaz, konteyner günlüğü yalnız başlangıç satırı içerir.
services:
  analytics:
    build:
      context: ../..
      dockerfile: server/analytics-deploy/Dockerfile
    restart: unless-stopped
    environment:
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:?ANALYTICS_TOKEN .env içinde tanımlı olmalı}
      PORT: "8788"
      HOST: "0.0.0.0"                   # yalnız compose ağında; dışarıya yayınlanmaz
      ANALYTICS_DATA: /data
      RETENTION_DAYS: "400"
      ANALYTICS_TRUST_PROXY: "1"        # Caddy arkasında hız sınırı için (IP ham saklanmaz)
    expose: ["8788"]
    volumes:
      - analytics_data:/data            # yalnız günlük toplam dosyaları
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [analytics]
    ports: ["80:80", "443:443"]
    environment:
      ANALYTICS_HOST: ${ANALYTICS_HOST:?ANALYTICS_HOST .env içinde tanımlı olmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                # sertifikalar (kalıcı)
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }   # Caddy yalnız başlangıç/sertifika satırları yazar (erişim günlüğü kapalı)

volumes:
  analytics_data:
  caddy_data:
  caddy_config:
