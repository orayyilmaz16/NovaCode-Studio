name: Dependabot güvenli güncellemeleri otomatik birleştir

# Dependabot PR'ında aynı ana sürüm içinde (patch/minor) güncelleme ise auto-merge açılır: CI (Kalite, Güvenlik, Performans)
# yeşil olunca birleşir. ANA SÜRÜM (major) atlamaları otomatik birleşmez; PR açık kalır ve insan inceler.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Patch/minor ise auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Sürüm atlamasını denetle ve auto-merge aç
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Başlık, betiğe ortam değişkeniyle geçer (komut enjeksiyonu yok)
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ from\ v?([0-9]+)[^\ ]*\ to\ v?([0-9]+) ]] && [ "${BASH_REMATCH[1]}" = "${BASH_REMATCH[2]}" ]; then
            gh pr merge --auto --squash "$PR_URL"
            echo "auto-merge açıldı: aynı ana sürüm"
          else
            echo "Ana sürüm atlaması (veya başlık okunamadı): otomatik birleştirilmez, elle incele."
          fi
