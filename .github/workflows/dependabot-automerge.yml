name: Dependabot güvenli güncellemeleri otomatik birleştir

# Dependabot PR'ında aynı ana sürüm içinde (patch/minor) güncelleme ise auto-merge açılır: CI (Kalite, Güvenlik, Performans)
# yeşil olunca birleşir. ANA SÜRÜM (major) atlamaları otomatik birleşmez; PR açık kalır ve insan inceler.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Patch/minor ise auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    steps:
      # Çalışma zamanı bağımlılıkları (dependencies) otomatik birleşmez: yalnız devDependencies ve github-actions (S-21)
      - name: Dependabot üst verisi
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sürüm atlamasını denetle ve auto-merge aç
        if: steps.meta.outputs.package-ecosystem == 'github_actions' || steps.meta.outputs.dependency-type == 'direct:development'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Başlık, betiğe ortam değişkeniyle geçer (komut enjeksiyonu yok)
          PR_TITLE: ${{ github.event.pull_request.title }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          # Electron yığını (electron, electron-builder, @electron/*): ana sürüm dahil hep son sürüme çıkar. Electron yeni
          # Chromium ve Node.js getirir (güvenlik/performans); riski CI korur: tip, test, build, bütçe ve Windows paketleme denetimi yeşil olmadan birleşmez.
          if [ -n "$DEP_NAMES" ] && ! printf '%s' "$DEP_NAMES" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -vqE '^(electron|electron-builder|@electron/.+)$'; then
            gh pr merge --auto --squash "$PR_URL"
            echo "auto-merge açıldı: Electron yığını (ana sürüm dahil)"
          elif [[ "$PR_TITLE" =~ from\ v?([0-9]+)[^\ ]*\ to\ v?([0-9]+) ]] && [ "${BASH_REMATCH[1]}" = "${BASH_REMATCH[2]}" ]; then
            gh pr merge --auto --squash "$PR_URL"
            echo "auto-merge açıldı: aynı ana sürüm"
          else
            echo "Ana sürüm atlaması (veya başlık okunamadı): otomatik birleştirilmez, elle incele."
          fi
