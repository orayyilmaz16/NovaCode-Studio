name: CI/CD Pipeline & Cross-Platform Desktop Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 1. Aşama: Kod Kalitesi, Güvenlik Taraması & Web Build
  test-and-security:
    name: 🛡️ Audit & Web Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=high || true

      - name: Build Web Application
        run: npm run build

  # 2. Aşama: Otonom Masaüstü Uygulaması Derleme (Windows .exe Installer)
  release-desktop:
    name: 📦 Build Windows Desktop Installer (.exe)
    needs: test-and-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Desktop Executable & NSIS Setup
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Windows Installer)
        uses: actions/upload-artifact@v4
        with:
          name: NovaCode-Studio-Windows-Installer
          path: release/*.exe
          retention-days: 14

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: NovaCode Studio Release v1.0.0 (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
