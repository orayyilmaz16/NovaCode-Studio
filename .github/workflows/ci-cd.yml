name: CI/CD - Kalite, Güvenlik, Sürüm, Masaüstü Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Var olan etiket için Windows kurulumunu ve GitHub Release'i yeniden üret (ör. v1.5.1). Boşsa yalnız kalite denetimi çalışır."
        required: false
        default: ""

# Aynı dalda eski koşular iptal edilir (sürüm etiketi işi hariç: o iş kendi grubunda sıralanır)
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

env:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"

permissions:
  contents: read

jobs:
  # 1) Tip kontrolü, ignore/sır hijyeni, güvenlik, build, performans bütçesi
  quality:
    name: Kalite, Güvenlik ve Performans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Yalnız denetler: sır bulunursa durur, .gitignore sapmaları uyarıdır (düzeltme sürüm işinde yapılır).
      - name: Ignore ve sır hijyeni
        run: node scripts/check-hygiene.mjs

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Senkron sunucusu sözdizimi
        run: node --check server/sync-server.mjs

      - name: Git modülü testleri
        run: npm test

      - name: Proje beyni tutarlılığı (md bağlantıları, IPC, i18n)
        run: npm run brain:check

      - name: Sürekli denetim (yeni yüksek/kritik güvenlik-performans bulgusu varsa durur)
        run: npm run audit:check

      - name: Sürüm denetimi (package.json ↔ lock ↔ etiket ↔ CHANGELOG ↔ güncelleyici)
        run: node scripts/check-version.mjs

      - name: Güvenlik açığı taraması (high+ build'i durdurur)
        run: npm audit --audit-level=high

      - name: Çalışma zamanı bağımlılıkları (moderate+ build'i durdurur)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Web build
        run: npm run build

      - name: Performans bütçesi
        run: node scripts/check-bundle.mjs

  # 2) Etiket (PR'da hazırlanan sürüm için; yalnız main push)
  version:
    name: Otomatik Sürümleme
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-version
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      release: ${{ steps.bump.outputs.release }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # Sürüm (package.json, CHANGELOG, release-notes, VERSIONS.md) PR'ın içinde hazırlanır (scripts/release.mjs prepare):
      # main korumalı olduğundan CI commit atamaz. CI yalnız etiket kararını verir ve açıklamalı etiketi atar.
      - name: Etiket kararı
        id: bump
        run: node scripts/release.mjs tag

      - name: Açıklamalı etiket ve push
        id: push
        run: |
          if [ "${{ steps.bump.outputs.release }}" = "true" ]; then
            git config user.name "novacode-bot"
            git config user.email "novacode-bot@users.noreply.github.com"
            git tag -a "v${{ steps.bump.outputs.version }}" -F "${{ steps.bump.outputs.tag_message_file }}"
            git push origin "v${{ steps.bump.outputs.version }}"
          else
            echo "Etiket atılmadı: ${{ steps.bump.outputs.reason }}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # 2b) PR'da masaüstü paketleme dumanı: electron/derleme yapılandırması değiştiyse Windows'ta paketlemeyi dener,
  # böylece release anında değil PR'da yakalanır. İlgisiz PR'larda adımlar atlanır (hızlı ve ucuz).
  desktop-smoke:
    name: Masaüstü paketleme denetimi (${{ matrix.label }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, os: windows-latest, flag: --win, cache1: '~\AppData\Local\electron\Cache', cache2: '~\AppData\Local\electron-builder\Cache' }
          - { label: macOS, os: macos-latest, flag: --mac, cache1: '~/Library/Caches/electron', cache2: '~/Library/Caches/electron-builder' }
          - { label: Linux, os: ubuntu-latest, flag: --linux, cache1: '~/.cache/electron', cache2: '~/.cache/electron-builder' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Paketlemeyi etkileyen dosya değişti mi?
        id: chg
        shell: bash
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(package(-lock)?\.json|electron-.*\.cjs|public/|\.github/workflows/ci-cd\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Paketlemeyi etkileyen değişiklik yok; atlandı."
          fi
      - if: steps.chg.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - if: steps.chg.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ matrix.cache1 }}
            ${{ matrix.cache2 }}
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: eb-${{ runner.os }}-
      - if: steps.chg.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - if: steps.chg.outputs.run == 'true'
        name: Paketle (kurulum üretmeden)
        shell: bash
        run: npx vite build && npx electron-builder ${{ matrix.flag }} --dir --publish never

  # 3) Windows, macOS ve Linux paketleri paralel derlenir; tek bir iş hepsini aynı GitHub Release'e yükler (yarış yok)
  build-desktop:
    name: Paket (${{ matrix.label }})
    needs: [quality, version]
    if: >-
      always() && needs.quality.result == 'success' &&
      (needs.version.outputs.release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, os: windows-latest, flag: --win, artifact: windows }
          - { label: macOS, os: macos-latest, flag: --mac, artifact: macos }
          - { label: Linux, os: ubuntu-latest, flag: --linux, artifact: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Elle yeniden denemede workflow'un çalıştırıldığı dal/commit derlenir (etiket eski kodda kalmış olabilir); etiket yalnız ad/not için
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      # Yaşam döngüsü betikleri kapalı: bağımlılık postinstall kodu çalışmaz (S-20)
      - run: npm ci --ignore-scripts
      - name: Masaüstü uygulaması derle
        shell: bash
        run: npx vite build && npx electron-builder ${{ matrix.flag }} --publish never
        env:
          # Kod imzalama (S-04): CSC_LINK (base64 .pfx/.p12 veya https bağlantısı) ve CSC_KEY_PASSWORD tanımlıysa imzalanır;
          # macOS noterliği için ayrıca APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID gerekir. Tanımsızsa paketler imzasız
          # üretilir (macOS'ta imzasız uygulamada otomatik güncelleme çalışmaz; Linux AppImage'ta çalışır).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NovaCode-Studio-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release-desktop:
    name: GitHub Release (Windows, macOS, Linux)
    needs: [build-desktop, version]
    if: always() && needs.build-desktop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || format('v{0}', needs.version.outputs.version) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.version.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: NovaCode-Studio-*
          path: release
          merge-multiple: true
      - name: GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NovaCode Studio ${{ env.RELEASE_TAG }}
          body_path: release-notes/${{ env.RELEASE_TAG }}.md
          generate_release_notes: false
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
