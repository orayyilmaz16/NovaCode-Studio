name: Otomatik düzeltme (mekanik kapı, ücretsiz)

# Yalnız qa-sweep'in açtığı, "auto-fix" etiketli ve "qa-fingerprint: brain" işaretli bot issue'su için.
# Deterministik düzeltici (scripts/auto-fix-brain.mjs) çözülmeyen [[bağlantı]]ları onarır: LLM yok, API anahtarı yok, ücret yok.
# Sonuç bir dal + PR olur; CI düzeltme dalında elle tetiklenir; birleştirmeyi İNSAN yapar. main'e doğrudan yazılmaz.
# Kural: docs/brain/actions/autopilot.md
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Düzeltilecek issue (qa-sweep tarafından açılmış olmalı)"
        required: true
        type: string

concurrency:
  group: auto-fix-${{ inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  fix:
    name: Düzelt, dal aç, PR aç, CI'ı tetikle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Issue koşullarını doğrula
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          data=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE")
          author=$(echo "$data" | jq -r '.user.login')
          state=$(echo "$data" | jq -r '.state')
          has_label=$(echo "$data" | jq -r '[.labels[].name] | index("auto-fix") != null')
          has_marker=$(echo "$data" | jq -r '.body' | grep -c 'qa-fingerprint: brain' || true)
          if [ "$author" = "github-actions[bot]" ] && [ "$state" = "open" ] && [ "$has_label" = "true" ] && [ "$has_marker" -ge 1 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Koşullar sağlanmadı (yazar=$author, durum=$state, etiket=$has_label); atlanıyor."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.verify.outputs.ok == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.verify.outputs.ok == 'true'
        with:
          node-version: 24

      - name: Düzeltmeyi uygula ve doğrula
        id: fix
        if: steps.verify.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          node scripts/auto-fix-brain.mjs
          if node scripts/brain.mjs --check; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Otomatik düzeltici bu hatayı tek başına çözemedi; PR açılmadı. İnsan incelemesi gerekli."
          fi
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dal aç, commit at, PR aç ve CI'ı tetikle
        if: steps.verify.outputs.ok == 'true' && steps.fix.outputs.verified == 'true' && steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          branch="auto-fix/issue-$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/brain
          git commit -m "fix(brain): çözülmeyen belge bağlantıları onarıldı (#$ISSUE)"
          git push origin "$branch"
          base="${GITHUB_REF_NAME}"
          gh pr create --base "$base" --head "$branch" \
            --title "fix(brain): çözülmeyen belge bağlantıları (#$ISSUE)" \
            --body "$(printf 'Closes #%s\n\nOtomatik düzeltici (deterministik, LLM yok) çözülmeyen [[bağlantı]]ları onardı. Yazım benzeri adlar en yakın dosyaya bağlandı; eşleşmeyenler düz metne çevrildi. Doğrulama: npm run brain:check geçti.\n\nBirleştirme insan işidir.' "$ISSUE")"
          # GITHUB_TOKEN ile açılan PR ve push, pull_request/push CI'ını tetiklemez; kaliteyi bu dalda elle koştur.
          gh workflow run ci-cd.yml --ref "$branch"
          echo "PR ve CI tetiklendi: $branch"
