# gitleaks yapılandırması: varsayılan kurallar + yalnız bilinen test sahte değerleri için dar izin.
# Eski ve yeni gitleaks sürümlerinde çalışsın diye [allowlist] biçimi kullanılır.
title = "NovaCode gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Test fixture: sahte token (gerçek sır yok) ve RFC 6455 örnek Sec-WebSocket-Key"
regexes = [
  '''abcd1234efgh5678''',
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]
